x-worker-base: &worker-base
  build: .
  image: marketplace-parse-worker
  restart: unless-stopped
  env_file: .env
  environment:
    # Override host-side .env values: inside the docker network the services
    # are reachable by their compose-service names, not localhost.
    POSTGRES_HOST: postgres
    RABBITMQ_HOST: rabbitmq
  volumes:
    # Mount the source so code edits don't require an image rebuild.
    - ./marketplace_parse:/app/marketplace_parse
    # Persist HuggingFace model cache across restarts (~700 MB rubert model).
    - hf_cache:/hf-cache
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  init: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: marketplace-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  worker-yandex:
    <<: *worker-base
    container_name: marketplace-worker-yandex
    command: python -m marketplace_parse.workers.parser --marketplace yandex_market

  worker-wildberries:
    <<: *worker-base
    container_name: marketplace-worker-wildberries
    command: python -m marketplace_parse.workers.parser --marketplace wildberries

  worker-megamarket:
    <<: *worker-base
    container_name: marketplace-worker-megamarket
    command: python -m marketplace_parse.workers.parser --marketplace megamarket

  scheduler:
    <<: *worker-base
    container_name: marketplace-scheduler
    command: python -m marketplace_parse.scheduler.runner

volumes:
  postgres_data:
  rabbitmq_data:
  hf_cache:
