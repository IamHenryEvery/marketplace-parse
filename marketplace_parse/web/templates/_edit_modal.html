<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <button class="modal-close" type="button" onclick="closeModal()">×</button>
    <h2>Редактировать товар</h2>
    <form hx-post="/products/{{ product.product_id }}/edit"
          hx-target="#cards"
          hx-swap="outerHTML"
          hx-on:htmx:after-request="if(event.detail.successful) closeModal()">
      <p>
        <label>Название<br>
          <input type="text" name="name" value="{{ product.name }}" required style="width: 100%;" autofocus>
        </label>
      </p>

      <fieldset>
        <legend>Существующие ссылки</legend>
        {% if product.urls %}
          {% for url in product.urls %}
          <div class="url-row">
            <input type="url" name="existing_url_{{ url.url_id }}" value="{{ url.url }}">
            <select name="existing_marketplace_{{ url.url_id }}">
              {% for mp in marketplaces %}
              <option value="{{ mp.marketplace_id }}" {% if mp.marketplace_id == url.marketplace_id %}selected{% endif %}>{{ mp.display_name }}</option>
              {% endfor %}
            </select>
            <label style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem; color: #b21f1f;">
              <input type="checkbox" name="delete_{{ url.url_id }}"> удалить
            </label>
          </div>
          {% endfor %}
        {% else %}
          <p class="empty">Пока нет ни одной ссылки.</p>
        {% endif %}
      </fieldset>

      <fieldset>
        <legend>Добавить новые ссылки</legend>
        {% for i in range(1, 4) %}
        <div class="url-row">
          <input type="url" name="new_url_{{ i }}" placeholder="https://...">
          <select name="new_marketplace_{{ i }}">
            <option value="">— маркетплейс —</option>
            {% for mp in marketplaces %}
            <option value="{{ mp.marketplace_id }}">{{ mp.display_name }}</option>
            {% endfor %}
          </select>
        </div>
        {% endfor %}
      </fieldset>

      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button type="button" onclick="closeModal()">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </div>
</div>
