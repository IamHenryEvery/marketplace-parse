<div id="cards" class="cards-grid">
  {% for card in cards %}
    <button class="card"
            hx-get="/products/{{ card.product.product_id }}"
            hx-target="#modal"
            hx-swap="innerHTML">
      <h3>{{ card.product.name }}</h3>
      <div class="badges">
        {% for mp in card.marketplaces %}
          <span class="badge">{{ mp.display_name }}</span>
        {% else %}
          <span class="empty">без ссылок</span>
        {% endfor %}
      </div>
    </button>
  {% endfor %}

  <button class="card card-add"
          hx-get="/products/new"
          hx-target="#modal"
          hx-swap="innerHTML">
    + Добавить товар
  </button>
</div>
