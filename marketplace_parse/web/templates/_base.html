<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}marketplace-parse{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.6"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-top: 0; }
    section { margin-bottom: 2.5rem; }
    fieldset { border: 1px solid #ddd; padding: 0.75rem 1rem; margin-bottom: 1rem; }
    .url-row { display: flex; gap: 0.5rem; margin-bottom: 0.4rem; }
    .url-row input[type=text], .url-row input[type=url] { flex: 1; }
    input[type=text], input[type=url], select { padding: 0.35rem 0.5rem; font-size: 0.95rem; }
    button { padding: 0.4rem 0.9rem; cursor: pointer; }
    article.product { border: 1px solid #ddd; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    article.product h3 { margin: 0 0 0.25rem; }
    article.product .meta { color: #777; font-size: 0.85rem; margin-bottom: 0.75rem; }
    ul.urls { list-style: none; padding: 0; margin: 0; }
    li.url { border-top: 1px solid #eee; padding: 0.6rem 0; }
    li.url code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 3px; word-break: break-all; }
    .badge { display: inline-block; background: #eef; color: #225; padding: 0.05rem 0.45rem; border-radius: 3px; font-size: 0.8rem; margin-left: 0.4rem; }
    .status-completed { color: #1a7f37; }
    .status-failed { color: #b21f1f; }
    .status-running, .status-pending { color: #b67500; }
    .htmx-indicator { display: none; margin-left: 0.5rem; color: #b67500; }
    .htmx-request .htmx-indicator { display: inline; }
    pre.error { background: #fff4f4; color: #b21f1f; padding: 0.5rem; border-radius: 4px; white-space: pre-wrap; font-size: 0.85rem; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
