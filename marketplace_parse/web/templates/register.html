{% extends "_base.html" %}
{% block title %}Регистрация — marketplace-parse{% endblock %}
{% block body %}
<div class="auth-card">
  <h2>Регистрация</h2>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="form-stack">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" required minlength="6">
    </label>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="meta">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
