<article class="product">
  <h3>{{ product.name }}</h3>
  <div class="meta">создан {{ product.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
  {% if product.urls %}
    <ul class="urls">
      {% for url in product.urls %}
        {% set last_run, review_count = url_states[url.url_id] %}
        {% include "_url_row.html" %}
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">Без ссылок.</p>
  {% endif %}
</article>
