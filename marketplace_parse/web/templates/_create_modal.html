<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <button class="modal-close" type="button" onclick="closeModal()">×</button>
    <h2>Новый товар</h2>
    <form hx-post="/products"
          hx-target="#cards"
          hx-swap="outerHTML"
          hx-on:htmx:after-request="if(event.detail.successful) closeModal()">
      <p>
        <label>Название<br>
          <input type="text" name="name" required style="width: 100%;" autofocus>
        </label>
      </p>
      <fieldset>
        <legend>Ссылки (хотя бы одна)</legend>
        {% for i in range(1, 4) %}
        <div class="url-row">
          <input type="url" name="url_{{ i }}" placeholder="https://...">
          <select name="marketplace_{{ i }}">
            <option value="">— маркетплейс —</option>
            {% for mp in marketplaces %}
            <option value="{{ mp.marketplace_id }}">{{ mp.display_name }}</option>
            {% endfor %}
          </select>
        </div>
        {% endfor %}
      </fieldset>
      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button type="button" onclick="closeModal()">Отмена</button>
        <button type="submit">Создать</button>
      </div>
    </form>
  </div>
</div>
