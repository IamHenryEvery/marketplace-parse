{% extends "_base.html" %}
{% block body %}
<header class="topbar">
  <a href="/"><strong>marketplace-parse</strong></a>
  <span class="spacer"></span>
  <label class="meta" title="Раз в сутки в 03:00 UTC автоматически парсить все ваши товары">
    <input type="checkbox"
           hx-post="/scheduler/toggle"
           hx-trigger="change"
           hx-swap="none"
           {% if current_user.scheduler_enabled %}checked{% endif %}>
    Авто-парсинг раз в сутки
  </label>
  <span class="user-email">{{ current_user.email }}</span>
  <a href="/logout">Выйти</a>
</header>

<h1>Товары</h1>

{% include "_cards.html" %}
{% endblock %}
